name: AddressSanitizer

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  asan:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      SANITIZER_FLAGS: "-O1 -g -fsanitize=address -fno-omit-frame-pointer -fno-optimize-sibling-calls"
      ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
    steps:
      - name: Setup Dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y clang libclang-rt-dev llvm make autoconf automake libtool libpcre2-dev libyajl-dev libxml2-dev libmaxminddb-dev libcurl4-gnutls-dev libssl-dev libcryptx-perl openssl
      - name: Get libModSecurity source
        run: |
          curl -L https://github.com/owasp-modsecurity/ModSecurity/releases/download/v3.0.17/modsecurity-v3.0.17.tar.gz -o modsecurity.tar.gz
          mkdir ModSecurity
          tar -xzf modsecurity.tar.gz -C ModSecurity --strip-components=1
      - name: Build libModSecurity with ASan
        working-directory: ModSecurity
        env:
          CFLAGS: "${{ env.SANITIZER_FLAGS }}"
          CXXFLAGS: "${{ env.SANITIZER_FLAGS }}"
          LDFLAGS: "${{ env.SANITIZER_FLAGS }}"
        run: |
          ./build.sh
          ./configure --without-lmdb --prefix=/usr
          make -j $(nproc)
          sudo make install
      - name: Get connector source
        uses: actions/checkout@v7
        with:
          path: ModSecurity-nginx
          fetch-depth: 1
      - name: Get Nginx source
        uses: actions/checkout@v7
        with:
          repository: nginx/nginx
          path: nginx
          fetch-depth: 1
      - name: Get Nginx tests
        uses: actions/checkout@v7
        with:
          repository: nginx/nginx-tests
          path: nginx/test
          fetch-depth: 1
      - name: Copy connector tests
        run: cp ModSecurity-nginx/tests/* nginx/test
      - name: Build Nginx and connector with ASan
        working-directory: nginx
        run: |
          ./auto/configure \
            --with-cc-opt="$SANITIZER_FLAGS -DNGX_DEBUG_PALLOC=1" \
            --with-ld-opt="-Wl,-rpath,/usr/local/lib $SANITIZER_FLAGS" \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-http_ssl_module \
            --with-http_auth_request_module \
            --add-module=../ModSecurity-nginx
          make -j $(nproc)
          make modules
      - name: Run connector tests under ASan
        working-directory: nginx/test
        shell: bash
        run: |
          set -o pipefail
          TEST_NGINX_BINARY=../objs/nginx prove modsecurity*.t 2>&1 | tee "$RUNNER_TEMP/modsecurity-asan.log"
          if grep -Eq 'AddressSanitizer|LeakSanitizer' "$RUNNER_TEMP/modsecurity-asan.log"; then
            exit 1
          fi